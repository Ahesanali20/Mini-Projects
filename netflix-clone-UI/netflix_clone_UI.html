<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix UI Clone</title>
    <link rel="stylesheet" href="netflix_clone_UI.css">
</head>

<body>
    <header>
        <div class="container">
            <nav class="navbar">
                <div class="logo">
                    <h1 class="logo__title">NETFLIX</h1>
                </div>
                <ul class="nav-links">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">TV Shows</a></li>
                    <li><a href="#">Movies</a></li>
                    <li><a href="#">New & Popular</a></li>
                    <li><a href="#">My List</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="movie">
            <div class="movie__content">
                <h1>Titanic</h1>
                <p>Titanic (1997) is an epic romance disaster film about a young aristocrat, Rose, who falls in love
                    with a poor artist, Jack, aboard the "unsinkable" RMS Titanic [1997].</p>
                <div class="movie__actions">
                    <button class="btn btn--play">Play</button>
                    <button class="btn btn--info">More Info</button>
                </div>
            </div>
        </section>

        <section class="trending">
            <h2 class="trending__title">Trending Now</h2>
            <div class="trending__movies">
                <ul class="trending__list">
                    <li class="trending__item"><img class="trending__poster" src="/Images/movies images/poc.jpg"
                            alt="Pirates of Caribians poster"></li>
                    <li class="trending__item"><img class="trending__poster" src="/Images/movies images/jack giant.jpg"
                            alt="Jack and Rose poster"></li>
                    <li class="trending__item"><img class="trending__poster" src="/Images/movies images/Journey-2.png"
                            alt="Journey 2 poster"></li>
                    <li class="trending__item"><img class="trending__poster" src="/Images/movies images/rava.avif"
                            alt="Rava movie poster"></li>
                    <li class="trending__item"><img class="trending__poster" src="/Images/movies images/black widow.jpg"
                            alt="Black Widow poster"></li>
                    <li class="trending__item"><img class="trending__poster" src="/Images/movies images/poc.jpg"
                            alt="Pocahontas poster"></li>
                    <li class="trending__item"><img class="trending__poster" src="/Images/movies images/poc.jpg"
                            alt="Pocahontas poster"></li>
                </ul>
            </div>
        </section>
    </main>


</body>

</html>
